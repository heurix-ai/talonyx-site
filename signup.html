<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon Signup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bone);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header with logo */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--ink);
    }

    /* Card */
    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .card-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    /* Form groups */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .label-required {
      color: var(--steel);
      margin-left: 2px;
    }

    input, select {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-family: inherit;
      color: var(--ink);
      background: #ffffff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--steel);
      box-shadow: 0 0 0 2px rgba(44, 74, 99, 0.1);
    }

    /* Error state */
    input.error, select.error {
      border-color: #ef4444;
      background: #fff5f5;
    }

    .field-error {
      font-size: 12px;
      color: #ef4444;
      margin-top: 4px;
      display: none;
    }

    .field-error.show {
      display: block;
    }

    /* SMS consent */
    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 8px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      font-weight: 400;
    }
    .consent input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 1px;
      flex-shrink: 0;
    }
    .consent a { color: var(--steel); }

    /* Submit button */
    .submit-btn {
      width: 100%;
      background: var(--steel);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #1f3347;
    }

    .submit-btn:active {
      background: #1a2a3c;
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Success message */
    .success-message {
      display: none;
      background: #f5fdf5;
      border: 1px solid #d0e8d0;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .success-message.show {
      display: block;
    }

    .success-title {
      font-size: 14px;
      font-weight: 600;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .success-text {
      font-size: 13px;
      color: #22c55e;
      line-height: 1.6;
    }

    /* Loading state */
    .submit-btn.loading {
      opacity: 0.7;
    }

    /* Link to login */
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }

    .footer a {
      color: var(--steel);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 16px;
      }

      .card {
        padding: 16px;
      }

      header {
        margin-bottom: 24px;
        padding-bottom: 16px;
      }
    }
  </style>
  <link rel="stylesheet" href="brand.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <svg width="14" height="28" viewBox="33 17 34 68" aria-hidden="true">
        <polygon points="50,82 36,46 50,54 64,46" fill="none" stroke="#2C4A63" stroke-width="6" stroke-linejoin="miter"/>
        <circle cx="50" cy="28" r="12" fill="#C68A3D"/>
      </svg>
      <h1>Beacon</h1>
    </header>

    <!-- Main card -->
    <div class="card">
      <!-- Success message (hidden by default) -->
      <div class="success-message" id="successMessage">
        <div class="success-title">Application submitted</div>
        <div class="success-text">
          Thank you for signing up for Beacon. Your application is under review. We've sent a login link to your email — you'll be able to log in once your application is approved.
        </div>
      </div>

      <!-- Form (hidden on success) -->
      <div id="formContainer">
        <h2 class="card-title">Create Your Account</h2>
        <p class="card-subtitle">Get access to Beacon's call marketplace.</p>

        <form id="signupForm" onsubmit="handleSubmit(event)">
          <!-- Name -->
          <div class="form-group">
            <label for="name">Full Name <span class="label-required">*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              required
            />
            <div class="field-error" id="nameError"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address <span class="label-required">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
            />
            <div class="field-error" id="emailError"></div>
          </div>

          <!-- Business Name -->
          <div class="form-group">
            <label for="businessName">Business Name <span class="label-required">*</span></label>
            <input
              type="text"
              id="businessName"
              name="businessName"
              placeholder="Your agency or DBA name"
              required
            />
            <div class="field-error" id="businessNameError"></div>
          </div>

          <!-- State -->
          <div class="form-group">
            <label for="state">State <span class="label-required">*</span></label>
            <select id="state" name="state" required>
              <option value="">Select a state...</option>
              <option value="AL">Alabama</option>
              <option value="AK">Alaska</option>
              <option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="IA">Iowa</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="ME">Maine</option>
              <option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option>
              <option value="MO">Missouri</option>
              <option value="MT">Montana</option>
              <option value="NE">Nebraska</option>
              <option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NY">New York</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VT">Vermont</option>
              <option value="VA">Virginia</option>
              <option value="WA">Washington</option>
              <option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </select>
            <div class="field-error" id="stateError"></div>
          </div>

          <!-- License Number -->
          <div class="form-group">
            <label for="licenseNumber">Insurance License Number <span class="label-required">*</span></label>
            <input
              type="text"
              id="licenseNumber"
              name="licenseNumber"
              placeholder="e.g., CA-LIC-4565644"
              required
            />
            <div class="field-error" id="licenseNumberError"></div>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phone">Phone Number (Optional)</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="(555) 123-4567 or +15551234567"
            />
            <div class="field-error" id="phoneError"></div>
          </div>

          <!-- SMS consent (opt in) -->
          <div class="form-group">
            <label class="consent">
              <input type="checkbox" id="smsConsent" name="smsConsent" />
              <span>I agree to receive account and service text messages from Talonyx at the number above (login links, call and wallet notifications, and support). Msg and data rates may apply. Msg frequency varies. Reply STOP to cancel, HELP for help. See our <a href="privacy.html" target="_blank">Privacy Policy</a> and <a href="terms.html" target="_blank">Terms</a>. Consent is not a condition of purchase.</span>
            </label>
          </div>

          <!-- Submit button -->
          <button type="submit" class="submit-btn" id="submitBtn">
            Create Account
          </button>
        </form>

        <!-- Login link -->
        <div class="footer">
          Already have an account? <a href="index.html">Log in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * Handle form submission via POST /signup
     * - Collect form data
     * - Submit to backend
     * - Handle validation errors (field-level)
     * - Show success message on success
     */
    async function handleSubmit(event) {
      event.preventDefault();

      // Clear previous errors
      clearAllErrors();

      // Collect form data
      const formData = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        business_name: document.getElementById('businessName').value.trim(),
        state: document.getElementById('state').value.trim(),
        license_number: document.getElementById('licenseNumber').value.trim(),
        phone: document.getElementById('phone').value.trim() || undefined,
        sms_consent: document.getElementById('smsConsent').checked,
      };

      // Disable button while submitting
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        });

        const data = await response.json();

        if (!response.ok) {
          // Handle validation errors
          if (data.errors && Array.isArray(data.errors)) {
            showFieldErrors(data.errors);
          } else if (data.error) {
            showGenericError(data.error);
          } else {
            showGenericError('Signup failed. Please try again.');
          }
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          return;
        }

        // Success! Show success message and hide form
        if (data.ok) {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMessage').classList.add('show');
        }
      } catch (error) {
        console.error('Signup request failed:', error);
        showGenericError('Network error. Please check your connection and try again.');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    }

    /**
     * Parse field errors from backend (format: "fieldname: message")
     * and display inline
     */
    function showFieldErrors(errors) {
      errors.forEach(error => {
        // Extract field name from error message (e.g., "email: invalid format")
        const match = error.match(/^([a-z_]+):\s*(.*)/i);
        if (match) {
          const fieldName = match[1].toLowerCase();
          const message = match[2];
          showFieldError(fieldName, message);
        }
      });
    }

    /**
     * Show error for a specific field
     */
    function showFieldError(fieldName, message) {
      // Map field names to input IDs
      const fieldMap = {
        name: 'name',
        email: 'email',
        business_name: 'businessName',
        state: 'state',
        license_number: 'licenseNumber',
        phone: 'phone',
      };

      const inputId = fieldMap[fieldName];
      if (!inputId) return;

      const input = document.getElementById(inputId);
      const errorEl = document.getElementById(inputId + 'Error');

      if (input) {
        input.classList.add('error');
      }
      if (errorEl) {
        errorEl.textContent = message;
        errorEl.classList.add('show');
      }
    }

    /**
     * Show generic error message
     */
    function showGenericError(message) {
      // For now, show in a field. In production, could show a banner.
      console.error('Signup error:', message);
      alert('Error: ' + message);
    }

    /**
     * Clear all field errors
     */
    function clearAllErrors() {
      document.querySelectorAll('input, select').forEach(el => {
        el.classList.remove('error');
      });
      document.querySelectorAll('.field-error').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }

    /**
     * Clear field error on input change
     */
    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', () => {
        el.classList.remove('error');
        const fieldName = el.id || el.name;
        const errorEl = document.getElementById(fieldName + 'Error');
        if (errorEl) {
          errorEl.classList.remove('show');
          errorEl.textContent = '';
        }
      });
    });
  </script>
</body>
</html>
